apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-budget
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 2Gi
    limits.memory: 4Gi
    requests.storage: 8Gi
    persistentvolumeclaims: "2"
    pods: "10"

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-object-store
spec:
  podSelector:
    matchLabels:
      app: objects
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: s3
      ports:
        - protocol: TCP
          port: 8333

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observer
subjects:
  - kind: ServiceAccount
    name: observer
    namespace: bd-g06
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observer

