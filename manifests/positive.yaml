apiVersion: v1
kind: Pod
metadata:
  name: quota-positive
spec:
  automountServiceAccountToken: false

  securityContext:
    runAsUser: 1000
    runAsNonRoot: true

  containers:
    - name: quota-positive
      image: busybox:1.36

      command:
        - sleep
        - "3600"

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

  restartPolicy: Never
