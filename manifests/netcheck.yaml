apiVersion: v1
kind: Pod
metadata:
  name: netcheck
  namespace: bd-g06
spec:
  restartPolicy: Never
  containers:
    - name: netcheck
      image: busybox:1.36
      command: ["wget"]
      args: ["-qO-", "http://objects:8333/"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
